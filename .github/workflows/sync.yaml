name: Run Sync & Cloud Pipelines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipelines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install opencv-python-headless pillow numpy requests gspread google-auth

      - name: Run Sync Pipeline (Merge Staging to cards.json)
        run: |
          python scripts/sync_pipeline.py

      - name: Run Cloud Pipeline (Check and update Sheet)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python scripts/cloud_pipeline.py

      - name: Commit and push updated database and assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add .
          git commit -m "sync permission" || true
          git push origin main --force
