name: Run Cloud Sheet Pipeline & Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install requests gspread google-auth pillow opencv-python-headless oauth2client 
      
      - name: Run Cloud Pipeline (Sync to Sheet)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python scripts/cleanup_pipeline.py  
          python scripts/cloud_pipeline.py
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies and Build
        run: |
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Commit and push updated cards and images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cards.json public/cards/ package-lock.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync cards and generated webp images [skip ci]" && git push)