name: Cleanup Card

on:
  workflow_dispatch:
    inputs:
      target_card_id:
        description: 'Card ID to delete (optional)'
        required: false
        default: ''
      target_member:
        description: 'Member name to delete (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install requests gspread google-auth oauth2client

      - name: Run Cleanup Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TARGET_CARD_ID: ${{ github.event.inputs.target_card_id }}
          TARGET_MEMBER: ${{ github.event.inputs.target_member }}
        run: |
          python scripts/cleanup_pipeline.py
          python scripts/sheet2json.py


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies and Build
        run: |
          npm install
          npm run build

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cards.json public/cards/ package-lock.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync cards, cleanup and update webp images [skip ci]" && git push)
