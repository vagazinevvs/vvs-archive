name: Deploy VVS Archive

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 設定 GITHUB_TOKEN 的權限，允許讀寫 Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install opencv-python-headless pillow numpy requests gspread google-auth

      - name: Run Cloud Pipeline (Sync Sheets & Temp Cards)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python scripts/cloud_pipeline.py

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_FORM_URL: ${{ secrets.FORM_ID }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4