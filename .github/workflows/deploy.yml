name: Process Cards Pipeline and Deploy

on:
  workflow_dispatch: # GitHub 後台手動點擊「Run workflow」觸發
  push:
    branches: [ main ] # 僅在修改網站程式碼推送到 main 時執行

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Python & Dependencies
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install opencv-python-headless pillow numpy requests gspread google-auth

      # 2. Run Image Optimization & Move Sheet Entries
      - name: Process pending cards
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python scripts/process_cards.py

      # 3. Commit new images and cards.json back to repository
      - name: Commit processed assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cards/ public/cards.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-process approved cards [skip ci]"
            git push origin main
          else
            echo "No new assets to commit."
          fi

      # 4. Build Static Site
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 5. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4